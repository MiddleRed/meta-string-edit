name: Go Build and Test

on:
  push:
    branches: [ master, develop ]
    paths:
      - '*.go'
      - 'go.*'
      - '.github/workflows/go-build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '*.go'
      - 'go.*'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --out-format=line-number

  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.17', '1.18', '1.21', '1.24', '1.25', 'stable']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -v -race .
  
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: metastringedit-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: metastringedit-linux-amd64
          - goos: linux
            goarch: arm64
            output: metastringedit-linux-arm64
          - goos: darwin
            goarch: amd64
            output: metastringedit-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: metastringedit-darwin-arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd ./metastringedit
          go build -ldflags="-s -w" -o ${{ matrix.output }} .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./metastringedit/${{ matrix.output }}
          retention-days: 7
